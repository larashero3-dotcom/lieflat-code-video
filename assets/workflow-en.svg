<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="A film, built in six beats."><rect width="1200" height="350" rx="16" fill="#F2F0EA"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica,Arial,sans-serif"><text x="36" y="52" fill="#1C1C1A" font-size="26" font-weight="650">A film, built in six beats.</text><text x="36" y="83" fill="#77736A" font-size="16">Roles can repeat, move or be skipped to fit the story.</text><rect x="36" y="120" width="178" height="177" rx="10" fill="white"/><text x="54" y="157" fill="#F5572F" font-size="19">01</text><text x="54" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Hook</text><text x="54" y="242" fill="#77736A" font-size="14">Earn attention</text><path d="M217 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="226" y="120" width="178" height="177" rx="10" fill="white"/><text x="244" y="157" fill="#F5572F" font-size="19">02</text><text x="244" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Ask</text><text x="244" y="242" fill="#77736A" font-size="14">Set the task</text><path d="M407 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="416" y="120" width="178" height="177" rx="10" fill="white"/><text x="434" y="157" fill="#F5572F" font-size="19">03</text><text x="434" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Work</text><text x="434" y="242" fill="#77736A" font-size="14">Show the action</text><path d="M597 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="606" y="120" width="178" height="177" rx="10" fill="white"/><text x="624" y="157" fill="#F5572F" font-size="19">04</text><text x="624" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Proof</text><text x="624" y="242" fill="#77736A" font-size="14">Make it tangible</text><path d="M787 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="796" y="120" width="178" height="177" rx="10" fill="white"/><text x="814" y="157" fill="#F5572F" font-size="19">05</text><text x="814" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Handoff</text><text x="814" y="242" fill="#77736A" font-size="14">Carry it forward</text><path d="M977 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="986" y="120" width="178" height="177" rx="10" fill="white"/><text x="1004" y="157" fill="#F5572F" font-size="19">06</text><text x="1004" y="207" fill="#1C1C1A" font-size="27" font-weight="650">Close</text><text x="1004" y="242" fill="#77736A" font-size="14">Land the message</text></g></svg>