<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="六个节拍，组织一部片子。"><rect width="1200" height="350" rx="16" fill="#F2F0EA"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica,Arial,sans-serif"><text x="36" y="52" fill="#1C1C1A" font-size="26" font-weight="650">六个节拍，组织一部片子。</text><text x="36" y="83" fill="#77736A" font-size="16">根据内容重复、调换或跳过，让结构服务于故事。</text><rect x="36" y="120" width="178" height="177" rx="10" fill="white"/><text x="54" y="157" fill="#F5572F" font-size="19">01</text><text x="54" y="207" fill="#1C1C1A" font-size="27" font-weight="650">钩子</text><text x="54" y="242" fill="#77736A" font-size="14">抓住注意力</text><path d="M217 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="226" y="120" width="178" height="177" rx="10" fill="white"/><text x="244" y="157" fill="#F5572F" font-size="19">02</text><text x="244" y="207" fill="#1C1C1A" font-size="27" font-weight="650">提问</text><text x="244" y="242" fill="#77736A" font-size="14">抛出任务</text><path d="M407 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="416" y="120" width="178" height="177" rx="10" fill="white"/><text x="434" y="157" fill="#F5572F" font-size="19">03</text><text x="434" y="207" fill="#1C1C1A" font-size="27" font-weight="650">干活</text><text x="434" y="242" fill="#77736A" font-size="14">让操作发生</text><path d="M597 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="606" y="120" width="178" height="177" rx="10" fill="white"/><text x="624" y="157" fill="#F5572F" font-size="19">04</text><text x="624" y="207" fill="#1C1C1A" font-size="27" font-weight="650">证明</text><text x="624" y="242" fill="#77736A" font-size="14">展示真实结果</text><path d="M787 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="796" y="120" width="178" height="177" rx="10" fill="white"/><text x="814" y="157" fill="#F5572F" font-size="19">05</text><text x="814" y="207" fill="#1C1C1A" font-size="27" font-weight="650">交接</text><text x="814" y="242" fill="#77736A" font-size="14">延续到下一步</text><path d="M977 208h7m-3 -3 3 3-3 3" fill="none" stroke="#F5572F" stroke-width="1.5"/><rect x="986" y="120" width="178" height="177" rx="10" fill="white"/><text x="1004" y="157" fill="#F5572F" font-size="19">06</text><text x="1004" y="207" fill="#1C1C1A" font-size="27" font-weight="650">结尾</text><text x="1004" y="242" fill="#77736A" font-size="14">留下核心印象</text></g></svg>